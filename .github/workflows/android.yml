name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make Gradle Wrapper Executable
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew || true
        fi

    # Install Android SDK (command-line tools) and required packages
    - name: Install Android SDK (command-line tools)
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        # The extracted folder may be named 'cmdline-tools'
        if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
        fi
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        # Install essential SDK components and accept licenses
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
      shell: bash

    # שלב זה מזריק את ההגדרות למניעת קריסת KSP ישירות לקובץ ההגדרות
    # שימו לב לירידת השורה הראשונה (echo "") - היא מוודאת שהשורות החדשות
    # לא יידבקו לסוף השורה האחרונה הקיימת בקובץ (אם הוא לא הסתיים בירידת שורה)
    - name: Force Headless Mode for KSP and Kotlin
      run: |
        echo "" >> gradle.properties
        echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx6144m" >> gradle.properties
        echo "kotlin.daemon.jvmopts=-Djava.awt.headless=true" >> gradle.properties
        echo "ksp.incremental=false" >> gradle.properties

    # Use the Gradle wrapper to ensure consistent Gradle version and avoid relying
    # on the system 'gradle' command. The wrapper will download the correct Gradle
    # distribution if needed.
    - name: Build with Gradle Wrapper
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    # מעלה את קובץ ה-APK שנוצר כ-artifact להורדה מעמוד ה-Actions
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SecureGuardMDM-debug-apk
        path: app/build/outputs/apk/debug/*.apk
